# Local full-stack run: Django backend + Next.js frontend, both talking to the
# external Supabase Postgres/Auth/Realtime via the committed-adjacent .env files.
# Browser hits localhost:8000 (API) and localhost:3000 (app) directly.
services:
  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    environment:
      # Threads so the frontend's parallel calls don't queue behind one sync
      # worker; longer timeout because the first DB connect to Supabase is slow.
      # One worker: every thread holds its own ~3s-to-open DB connection, so
      # 1x8 warms up twice as fast as 2x8 and still covers a page's parallel calls.
      GUNICORN_CMD_ARGS: "--workers 1 --threads 8 --timeout 120"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend
