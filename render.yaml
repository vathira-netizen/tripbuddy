# Render blueprint for the backend Docker service.
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in the Render dashboard ("New +" -> "Blueprint"),
# point it at this file, then fill in the secret env vars below in the
# Render dashboard (they are intentionally not committed here).
#
# The frontend (frontend/) is NOT deployed by this blueprint — deploy it to
# Vercel instead (see README.md "Deployment" section).
#
# Instance type: `free`, so the blueprint can be created without a card on
# file. Two consequences worth knowing:
#
#   * A free service sleeps after ~15 minutes idle, and the next request pays
#     a 30-60s cold start. That reads as a broken app to anyone testing it.
#   * `preDeployCommand` is a paid-instance feature, so migrations cannot run
#     there. They run at container start instead — see backend/Dockerfile.
#
# Switching to `starter` (paid) is the fix for both: move the migrate call back
# into a preDeployCommand here and drop it from the Dockerfile CMD.

services:
  - type: web
    name: tripbuddy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      # Your <service>.onrender.com host.
      - key: ALLOWED_HOSTS
        sync: false
      # Your Vercel production URL, no trailing slash. Until this is set the
      # frontend loads but every API call fails CORS.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # AI itinerary generator (Phase 6). Server-side only — never expose these
      # to the browser or copy them into a NEXT_PUBLIC_ variable. Without
      # GROQ_API_KEY the generate endpoint returns 503 and nothing else breaks.
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      # Pinned explicitly: the code default is llama-3.3-70b-versatile, so leaving this
      # unset would silently run a different model in production than in dev.
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
